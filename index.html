<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Work Abroad | Find Jobs Worldwide</title>

  <meta name="description" content="Global Work Abroad helps job seekers discover international employment opportunities.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f5f7fa;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    nav {
      background: #0b3d91;
      color: white;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: white;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 25px;
    }

    .hero {
      background: linear-gradient(135deg, #0b3d91, #1976d2);
      color: white;
      padding: 80px 5%;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .search-box {
      max-width: 600px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    .search-box button {
      padding: 14px 20px;
      border: none;
      border-radius: 6px;
      background: #ff9800;
      color: white;
      font-weight: bold;
    }

    .section {
      padding: 60px 5%;
      max-width: 1200px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 32px;
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .job-card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .job-card h3 {
      color: #0b3d91;
      margin-bottom: 10px;
    }

    .job-card p {
      margin: 6px 0;
    }

    .apply-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #0b3d91;
      color: white;
      font-weight: bold;
    }

    .apply-btn:hover {
      background: #062b66;
    }

    .no-jobs {
      display: none;
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .notice {
      background: #fff3cd;
      padding: 20px;
      border-left: 5px solid #ff9800;
      border-radius: 5px;
    }

    .contact-form {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .contact-form textarea {
      height: 120px;
      resize: vertical;
    }

    .whatsapp-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #25d366;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    footer {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      border-radius: 10px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 20px;
      top: 10px;
      font-size: 28px;
      cursor: pointer;
      color: #555;
    }

    .modal-content input,
    .modal-content textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-content textarea {
      height: 100px;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #0b3d91;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background: #0b3d91;
        flex-direction: column;
        padding: 20px;
      }

      .nav-links.active {
        display: flex;
      }

      .menu-btn {
        display: block;
      }

      .hero h1 {
        font-size: 32px;
      }

      .search-box {
        flex-direction: column;
      }
    }
  </style>
</head>
